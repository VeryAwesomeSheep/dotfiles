# Music directory
music_directory    "~/Music"

# Files 
db_file            "~/.config/mpd/db"
playlist_directory "~/.config/mpd/playlists"
#pid_file           "~/.config/mpd/pid"
state_file         "~/.config/mpd/state"
sticker_file       "~/.config/mpd/sticker"
log_file           "syslog"

# Auto refresh database whenever music_directory files change
auto_update "yes"

# Start MPD as paused
restore_paused "yes"

audio_output {
    type        "pipewire"
    name        "PipeWire Sound Server"
    mixer_type  "hardware"
}

