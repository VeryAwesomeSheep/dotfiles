################
### MONITORS ###
################

source = hyprlandMonitorsPC.conf
#source = hyprlandMonitorsT480s.conf
#source = hyprlandMonitorsX260.conf

###################
### MY PROGRAMS ###
###################

$terminal = kitty
$fileManager = $terminal --class yazi -e 'yazi'
$tofi_launcher = tofi-drun --drun-launch=true
$tofi_power_menu = $HOME/.config/scripts/tofi_power_menu.sh
$tofi_open_windows = $HOME/.config/scripts/tofi_windows.sh
$grab_screenshot = grim -g "$(slurp)" - | swappy -f - -o - | wl-copy

#################
### AUTOSTART ###
#################

# Hyprland utils and key desktop elements
exec-once = hyprsunset -i # Launch with "-i" to keep default colors. Temperature controled via service
exec-once = hypridle
exec-once = waybar
exec-once = swaync&
exec-once = swaybg -i "$HOME/Pictures/Wallpapers/sheep_cat_sitting_minimalistic_dark.png"
#exec-once = hyprpm reload -nn # Hyprland plugins with error notifications on, not using plugins for now

# Clipboard listener
exec-once = clipse -listen

# Apps to run on startup
exec-once = signal-desktop # Signal
exec-once = vesktop --start-minimized # Vesktop
exec-once = blueman-applet # Bluetooth utility
exec-once = mpDris2 # MPRIS for MPD

#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 1
    gaps_out = 2

    border_size = 2

    col.active_border = rgb(f5deb3)
    col.inactive_border = rgba(282828aa)

    resize_on_border = true

    allow_tearing = false

    layout = dwindle
}

decoration {
    rounding = 5

    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = false
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

animations {
    enabled = yes, please :)

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
}

# Ref https://wiki.hyprland.org/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrulev2 = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrulev2 = rounding 0, floating:0, onworkspace:w[tv1]
# windowrulev2 = bordersize 0, floating:0, onworkspace:f[1]
# windowrulev2 = rounding 0, floating:0, onworkspace:f[1]

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

misc {
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
}


#############
### INPUT ###
#############

input {
    kb_layout = pl
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =
    numlock_by_default = true

    follow_mouse = 1

    sensitivity = -0.5 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
    }
}

device {
    name = steelseries-steelseries-kinzu-v3-gaming-mouse
    sensitivity = -0.5
}

###################
### KEYBINDINGS ###
###################

bind = SUPER, C, killactive, # Kill current window
bind = SUPER, F, togglefloating, # Toggle window to/from floating
bind = SUPER, RETURN, fullscreen # Toggle window fullscreen
bind = SUPER, J, togglesplit

#bind = SUPER, M, exit, # Exit Hyprland
bind = SUPER, L, exec, $tofi_power_menu
#bind = ALT, TAB, exec, $tofi_open_windows

bind = SUPER, Q, exec, $terminal # Open terminal
bind = SUPER, E, exec, $fileManager # Open file manager
bind = SUPER, R, exec, $tofi_launcher # Open menu
bind = SUPER, V, exec, $terminal --class clipse -e 'clipse' # Open clipboard
bind = SUPER SHIFT, S, exec, $grab_screenshot # Grab screen shot

# Move focus with mainMod + arrow keys
bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d

# Resize current window
bind = SUPER, S, submap, resize
submap = resize
binde = , right, resizeactive, 15 0
binde = , left, resizeactive, -15 0
binde = , up, resizeactive, 0 -15
binde = , down, resizeactive, 0 15
bind = , catchall, submap, reset # prevent input passing to the window and exit resizing on any non arrow key
submap = reset

# Switch focused monitor
bind = SUPER, 1, focusmonitor, DP-1
bind = SUPER, 2, focusmonitor, DP-2

# Switch to next/prev workspace
bind = SUPER LEFT_ALT, right, workspace, m+1 # with arrows
bind = SUPER LEFT_ALT, left, workspace, m-1
bind = SUPER LEFT_ALT, mouse_down, workspace, m+1 # with scroll
bind = SUPER LEFT_ALT, mouse_up, workspace, m-1

# Switch to next/prev workspace on both monitors (GNOME like)
bind = SUPER LEFT_ALT SHIFT, right, exec, hyprctl dispatch workspace m+1 && hyprctl dispatch focusmonitor +1 && hyprctl dispatch workspace m+1 && hyprctl dispatch focusmonitor +1 # with arrows
bind = SUPER LEFT_ALT SHIFT, left, exec, hyprctl dispatch workspace m-1 && hyprctl dispatch focusmonitor +1 && hyprctl dispatch workspace m-1 && hyprctl dispatch focusmonitor +1
bind = SUPER LEFT_ALT SHIFT, mouse_down, exec, hyprctl dispatch workspace m+1 && hyprctl dispatch focusmonitor +1 && hyprctl dispatch workspace m+1 && hyprctl dispatch focusmonitor +1 # with scroll
bind = SUPER LEFT_ALT SHIFT, mouse_up, exec, hyprctl dispatch workspace m-1 && hyprctl dispatch focusmonitor +1 && hyprctl dispatch workspace m-1 && hyprctl dispatch focusmonitor +1

# Move active window to a next/prev workspace
bind = SUPER SHIFT, right, movetoworkspace, m+1 # with arrows
bind = SUPER SHIFT, left, movetoworkspace, m-1
bind = SUPER SHIFT, mouse_down, movetoworkspace, m+1 # with scroll
bind = SUPER SHIFT, mouse_up, movetoworkspace, m-1

# Move active window to currently active workspace on next monitor
#bind = SUPER, G, movewindow, mon:+1

# Move window
bind = SUPER LEFT_CTRL, right, movewindow, r
bind = SUPER LEFT_CTRL, left, movewindow, l
bind = SUPER LEFT_CTRL, up, movewindow, u
bind = SUPER LEFT_CTRL, down, movewindow, d

# Toggle group
#bind = SUPER, G, togglegroup

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# Multimedia on normal keyboard
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle # Mute mic with mute vol key, remove it from laptop config

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
#bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##################
### WORKSPACES ###
##################

workspace = 1, monitor:DP-1, persistent:true, default:true
workspace = 2, monitor:DP-1, persistent:true
workspace = 3, monitor:DP-1, persistent:true
workspace = 4, monitor:DP-1, persistent:true

workspace = 5, monitor:DP-2, persistent:true, default:true
workspace = 6, monitor:DP-2, persistent:true
workspace = 7, monitor:DP-2, persistent:true
workspace = 8, monitor:DP-2, persistent:true

###############
### WINDOWS ###
###############

# Ignore maximize requests from apps. You'll probably like this.
windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

# Fix some dragging issues with XWayland
windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Pavucontrol - open in center as floating
windowrule {
    name = pavucontrol
    match:class = org.pulseaudio.pavucontrol
    float = true
    center = true
    size = 1000 600
}

# Calculator - open in center as floating
windowrule {
    name = gnome-calc
    match:class = org.gnome.Calculator
    float = true
    center = true
    size = 1 1 # force smallest size
}

# Blueman - open in center as floating
windowrule {
    name = blueman-manager
    match:class = blueman-manager
    float = true
    center = true
    size = 1000 600
}

# LACT - open in center as floating
windowrule {
    name = lact
    match:class = io.github.lact-linux # TODO: fix
    float = true
    center = true
    size = 1000 600
}

# Signal - open in center as floating
windowrule {
    name = signal
    match:class = Signal # TODO: fix
    float = true
    center = true
    size = 1000 600
}

# yazi - open in center as floating
windowrule {
    name = yazi
    match:class = yazi
    float = true
    center = true
    size = 1000 600
}

# Clipse - open in center as floating
windowrule {
    name = clipse
    match:class = clipse
    float = true
    center = true
    size = 622 652
}
# hyprbars plugin
#windowrule = plugin:hyprbars:nobar, floating:0
#windowrule = plugin:hyprbars:nobar, floating:1

###############
### PLUGINS ###
###############

source = plugins.conf
